{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Edit Product</h2>
        <a href="{{ url_for('my_products') }}" class="btn btn-outline-success">
            <i class="fas fa-arrow-left me-2"></i>Back to My Products
        </a>
    </div>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ product.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
                <span class="input-group-text">&#8377;</span>
                <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity Available</label>
            <input type="number" class="form-control" id="quantity" name="quantity" min="0" value="{{ product.quantity }}" required>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
                {% for category in categories %}
                <option value="{{ category }}" {% if product.category and product.category|lower == category|lower %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Product Photo</label>
            {% if product.image_url %}
            <div class="mb-2">
                <img src="{{ url_for('static', filename=product.image_url) }}" alt="{{ product.name }}" style="max-height: 200px;" class="img-thumbnail"
                     onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/default/vegetables.jpg') }}'">
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="remove_image" name="remove_image">
                    <label class="form-check-label" for="remove_image">
                        Remove current photo
                    </label>
                </div>
            </div>
            {% endif %}
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
            <small class="text-muted">Leave empty to keep the current photo. Max 16 MB.</small>
        </div>
        <div class="mb-3 d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-2"></i>Update Product
            </button>
            <a href="{{ url_for('my_products') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <hr class="my-4">
    <form action="{{ url_for('delete_product', product_id=product.id) }}" method="POST"
          onsubmit="return confirm('Delete &quot;{{ product.name }}&quot;? This cannot be undone.');">
        <button type="submit" class="btn btn-outline-danger">
            <i class="fas fa-trash-alt me-2"></i>Delete this product
        </button>
        <small class="text-muted ms-2">Removes the listing and any orders attached to it.</small>
    </form>
</div>
{% endblock %}
